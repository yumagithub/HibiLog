name: 💡 機能リクエスト
description: 新機能のアイデアを提案する
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能リクエストありがとうございます。以下の情報を記入してください。

  - type: textarea
    id: problem
    attributes:
      label: 関連する問題
      description: この機能リクエストに関連する問題を記入してください。
      placeholder: 例）〜の操作が面倒、〜ができない、など
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する機能
      description: 考えられる解決策を記入してください
      placeholder: 例）〜の自動化、〜の追加、など
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に考えられる解決策があれば記入してください。
      placeholder: 例）他のツールを使う、手動で対応する、など
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: その他の情報
      description: その他、参考になる情報があれば記入してください。
      placeholder: 例）関連するリンクやスクリーンショット、など
    validations:
      required: false
