name: 🐛 バグ報告
description: バグを報告する
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。以下の情報を記入してください。

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: バグの内容を詳しく記入してください。
      placeholder: できるだけ具体的に記入してください。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記入してください。
      placeholder: |
        1. 〜をする
        2. 〜をクリックする
        3. エラーが発生する
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: 発生したブラウザ
      multiple: true
      description: 使用したブラウザを選択してください。（複数選択可能）
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Safari
        - その他
